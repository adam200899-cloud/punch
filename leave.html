<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>請假申請</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --ink:#1b2436; --muted:#7b869c;
    --brand:#1f3864; --ok:#1DB446; --warn:#E8A33D; --bad:#D64545; --line:#e6eaf2;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#12151c; --card:#1b1f2a; --ink:#eef1f6; --muted:#98a2b6; --line:#2b3140; --brand:#3f6bb0; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;
       -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:520px;margin:0 auto;padding:18px 16px 40px}
  .card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;
        box-shadow:0 1px 3px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.05)}
  h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  h3{font-size:15px;margin:0 0 12px}

  label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
  .field{margin-bottom:14px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
  textarea{min-height:76px;resize:vertical}
  .g2{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}

  button{font:inherit;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;
         color:#fff;background:var(--brand);cursor:pointer;width:100%}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.sm{width:auto;padding:6px 12px;font-size:12px;font-weight:500;background:transparent;
            color:var(--bad);border:1px solid var(--line);border-radius:8px}

  .rule{background:rgba(127,140,170,.09);border-radius:10px;padding:11px 13px;font-size:12.5px;
        line-height:1.7;color:var(--muted);margin-top:-6px;margin-bottom:14px}
  .rule b{color:var(--ink)}
  .days{text-align:center;font-size:13px;color:var(--muted);margin-bottom:14px}
  .days b{font-size:26px;color:var(--brand);display:block;font-variant-numeric:tabular-nums}

  .msg{padding:13px 15px;border-radius:11px;font-size:14px;line-height:1.65;
       margin-bottom:14px;display:none;white-space:pre-line}
  .msg.show{display:block}
  .msg.ok{background:rgba(29,180,70,.12);color:var(--ok)}
  .msg.bad{background:rgba(214,69,69,.12);color:var(--bad)}
  .msg.warn{background:rgba(232,163,61,.14);color:var(--warn)}

  .lv{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:10px;align-items:flex-start}
  .lv:first-of-type{border-top:0}
  .lv .ic{font-size:17px;line-height:1.3}
  .lv .bd{flex:1;min-width:0}
  .lv .t1{font-size:14px;font-weight:600}
  .lv .t2{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.6}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 0}
  .skeleton{height:14px;border-radius:7px;margin:8px 0;
    background:linear-gradient(90deg,rgba(127,140,170,.12),rgba(127,140,170,.22),rgba(127,140,170,.12));
    background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 id="title">請假申請</h1>
    <p class="sub" id="who"><span class="skeleton" style="display:block;width:55%"></span></p>

    <div id="msg" class="msg"></div>

    <div id="form" style="display:none">
      <div class="field">
        <label>假別</label>
        <select id="fType"></select>
      </div>
      <div class="rule" id="rule"></div>

      <div class="field">
        <label>開始</label>
        <div class="g2">
          <input id="fFrom" type="date">
          <select id="fFromHalf"><option>全天</option><option>上午</option><option>下午</option></select>
        </div>
      </div>

      <div class="field">
        <label>結束</label>
        <div class="g2">
          <input id="fTo" type="date">
          <select id="fToHalf"><option>全天</option><option>上午</option><option>下午</option></select>
        </div>
      </div>

      <div class="days">合計<b id="fDays">—</b>天</div>

      <div class="field">
        <label>事由</label>
        <textarea id="fReason" placeholder="請簡述請假原因"></textarea>
      </div>

      <button id="fGo">送出申請</button>
      <p style="font-size:12px;color:var(--muted);text-align:center;line-height:1.8;margin:16px 0 0">
        請假不限地點,在家或外出時都可以送出。<br>只有上下班打卡需要連公司 Wi-Fi。
      </p>
    </div>
  </div>

  <div class="card" id="listCard" style="display:none">
    <h3>我的請假紀錄</h3>
    <div id="list"></div>
  </div>
</div>

<script>
/* ─────────────────────────────────────────────
   設定集中在 config.js,這裡不用改
   ───────────────────────────────────────────── */
const CFG = window.PUNCH_CONFIG || {};
const USE_PROXY = !!CFG.PROXY_URL;
const API_URL = USE_PROXY ? CFG.PROXY_URL : (CFG.GAS_URL || '') + '?p=api';
const CONFIG_OK = /^https:\/\/(script\.google\.com|[\w.-]+\.workers\.dev)/.test(USE_PROXY ? CFG.PROXY_URL : CFG.GAS_URL || '')
                  && (CFG.GAS_URL || '').indexOf('請貼上') < 0;

const $ = id => document.getElementById(id);
const tg = window.Telegram && window.Telegram.WebApp;
let company = null, platform = null, auth = {}, INFO = null, busy = false;

function readCompany(){
  const p = new URLSearchParams(location.search);
  const direct = p.get('c');
  if(direct) return direct.toUpperCase();
  const state = p.get('liff.state');
  if(state){
    const m = decodeURIComponent(state).match(/[?&]c=([^&]+)/);
    if(m) return decodeURIComponent(m[1]).toUpperCase();
  }
  return null;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function say(kind,text){ const el=$('msg'); el.className='msg show '+kind; el.textContent=text; }
function clearMsg(){ $('msg').className='msg'; }

async function api(payload){
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({company}, payload, auth)),
    redirect:'follow',
  });
  const j = await res.json();
  if(!j.ok && j.message) throw Object.assign(new Error(j.message), {code:j.code});
  return j;
}

function closeWindow(){
  if(platform === 'telegram'){ if(tg) tg.close(); }
  else if(typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()){ liff.closeWindow(); }
}

// ── 天數試算(與後端 countLeaveDays_ 同一套規則)──
function calcDays(){
  const from = $('fFrom').value, to = $('fTo').value;
  if(!from || !to) return 0;
  const a = new Date(from+'T00:00:00'), b = new Date(to+'T00:00:00');
  let d = Math.round((b-a)/86400000) + 1;
  if(d <= 0) return 0;
  const fh = $('fFromHalf').value, th = $('fToHalf').value;
  if(d === 1) return (fh==='全天' && th==='全天') ? 1 : 0.5;
  if(fh === '下午') d -= 0.5;
  if(th === '上午') d -= 0.5;
  return d;
}

function refreshDays(){
  const d = calcDays();
  $('fDays').textContent = d > 0 ? d : '—';
  validate();
}

/** 前端先擋一次提前天數,錯誤訊息比等後端退回友善 */
function validate(){
  const t = (INFO.leaveTypes || []).find(x => x.name === $('fType').value);
  if(!t) return;
  const from = $('fFrom').value;
  clearMsg();
  if(t.leadDays > 0 && from){
    const today = new Date(INFO.today+'T00:00:00');
    const lead = Math.round((new Date(from+'T00:00:00') - today)/86400000);
    if(lead < t.leadDays){
      say('warn', `${t.name}需於開始日 ${t.leadDays} 天前提出申請,你選的日期只提前 ${lead} 天。\n` +
                  `如果是臨時狀況,請直接聯絡主管處理。`);
      $('fGo').disabled = true;
      return;
    }
  }
  $('fGo').disabled = !(calcDays() > 0);
}

function renderRule(){
  const t = (INFO.leaveTypes || []).find(x => x.name === $('fType').value);
  if(!t){ $('rule').textContent=''; return; }
  const lead = t.leadDays > 0 ? `需提前 <b>${t.leadDays}</b> 天申請` : '<b>可事後補辦</b>,不受提前天數限制';
  $('rule').innerHTML =
    `${lead}<br>年度上限:<b>${esc(t.quota||'—')}</b> · 給薪:<b>${esc(t.pay||'—')}</b>` +
    (t.proof && t.proof !== '否' ? `<br>證明文件:${esc(t.proof)}` : '') +
    (t.note ? `<br><span style="opacity:.75">${esc(t.note)}</span>` : '');
  validate();
}

function renderList(){
  const list = INFO.myLeaves || [];
  $('listCard').style.display = 'block';
  if(!list.length){ $('list').innerHTML = '<div class="empty">還沒有請假紀錄</div>'; return; }
  const icon = {'待審核':'⏳','已核准':'✅','已駁回':'❌','已取消':'⚪'};
  $('list').innerHTML = list.map(l=>{
    const range = l.from === l.to ? l.from : `${l.from} ~ ${l.to}`;
    return `<div class="lv">
      <div class="ic">${icon[l.status]||''}</div>
      <div class="bd">
        <div class="t1">${esc(l.leaveType)} · ${l.days} 天</div>
        <div class="t2">${esc(range)}<br>${esc(l.status)}${l.approver?' · '+esc(l.approver):''} · ${esc(l.id)}</div>
      </div>
      ${l.status==='待審核'?`<button class="sm" data-cancel="${esc(l.id)}">取消</button>`:''}
    </div>`;
  }).join('');
  $('list').querySelectorAll('[data-cancel]').forEach(b => b.onclick = ()=>doCancel(b.dataset.cancel));
}

async function doCancel(id){
  if(busy) return;
  busy = true;
  try{
    const r = await api({action:'leaveCancel', leaveId:id});
    say('ok', r.message);
    await load();
  }catch(e){ say('bad', e.message); }
  finally{ busy = false; }
}

async function load(){
  const r = await api({action:'leaveInfo'});
  INFO = r;
  $('title').textContent = '請假申請';
  $('who').textContent = `${r.companyName} · ${r.name}(${r.code})${r.dept ? ' · '+r.dept : ''}`;
  $('form').style.display = 'block';

  const cur = $('fType').value;
  $('fType').innerHTML = (r.leaveTypes||[]).map(x=>`<option>${esc(x.name)}</option>`).join('');
  if(cur) $('fType').value = cur;
  if(!$('fFrom').value) $('fFrom').value = r.today;
  if(!$('fTo').value)   $('fTo').value = $('fFrom').value;
  renderRule(); refreshDays(); renderList();
}

async function boot(){
  if(!CONFIG_OK){
    say('bad','config.js 裡的 GAS_URL 還沒填。\n請把 Apps Script 部署後拿到的 /exec 網址貼進去。');
    return;
  }
  company = readCompany();
  if(!company){ say('bad','網址缺少公司代碼,請從聊天室的「請假」按鈕開啟。'); return; }

  let cfg;
  try{ cfg = await api({action:'config'}); }
  catch(e){ say('bad', e.message); return; }
  platform = cfg.platform;
  $('title').textContent = cfg.companyName + ' 請假';

  if(platform === 'telegram'){
    if(!tg || !tg.initData){
      say('bad','這一頁要從 Telegram 聊天室的「🗓 請假」按鈕開啟才能辨識身分。');
      return;
    }
    tg.ready(); tg.expand();
    auth = { initData: tg.initData };
  }else{
    try{ await liff.init({ liffId: cfg.liffId }); }
    catch(e){ say('bad','LIFF 初始化失敗:'+(e.message||e)); return; }
    if(!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return; }
    const idToken = liff.getIDToken();
    if(!idToken){ say('bad','取不到 ID Token,請確認 LIFF 已開啟 openid 權限。'); return; }
    auth = { idToken };
  }

  try{ await load(); }
  catch(e){ say(e.code==='NOT_BOUND'?'warn':'bad', e.message); }
}

$('fType').addEventListener('change', renderRule);
$('fFrom').addEventListener('change', ()=>{
  if(!$('fTo').value || $('fTo').value < $('fFrom').value) $('fTo').value = $('fFrom').value;
  refreshDays();
});
['fTo','fFromHalf','fToHalf'].forEach(id => $(id).addEventListener('change', refreshDays));

$('fGo').addEventListener('click', async ()=>{
  if(busy) return;
  busy = true; $('fGo').disabled = true; $('fGo').textContent = '送出中…';
  try{
    const r = await api({
      action:'leaveSubmit',
      leaveType: $('fType').value,
      from: $('fFrom').value.replace(/-/g,'/'),
      fromHalf: $('fFromHalf').value,
      to: $('fTo').value.replace(/-/g,'/'),
      toHalf: $('fToHalf').value,
      reason: $('fReason').value.trim(),
    });
    say('ok', r.message);
    $('fReason').value = '';
    await load();
    setTimeout(closeWindow, 2600);
  }catch(e){
    say(e.code==='LEAD_TIME'?'warn':'bad', e.message);
  }finally{
    busy = false; $('fGo').textContent = '送出申請'; validate();
  }
});

boot();
</script>
</body>
</html>
