<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>打卡</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{ --bg:#17212b; --card:#1f2c39; --ink:#fff; --dim:#8fa5b8;
         --ok:#3fbf6d; --bad:#e8555f; --line:#2b3b4c; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--ink);
       font:16px/1.6 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding:20px}
  .card{width:100%;max-width:340px;background:var(--card);border-radius:18px;
        padding:28px 22px;text-align:center;border:1px solid var(--line)}
  .icon{font-size:52px;line-height:1;margin-bottom:14px}
  h1{font-size:21px;margin:0 0 6px;font-weight:700}
  .sub{color:var(--dim);font-size:14px;margin:0;white-space:pre-line}
  .time{font-size:40px;font-weight:800;letter-spacing:1px;margin:12px 0 2px;
        font-variant-numeric:tabular-nums}
  .judge{font-size:15px;color:var(--dim)}
  .ok .time{color:var(--ok)} .bad h1{color:var(--bad)}
  .net{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
       color:var(--dim);font-size:12.5px;word-break:break-all}
  .spin{width:34px;height:34px;margin:6px auto 14px;border:3px solid var(--line);
        border-top-color:var(--dim);border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  button{margin-top:18px;width:100%;padding:13px;border:0;border-radius:11px;
         background:#5288c1;color:#fff;font-size:16px;font-weight:600}
  button.big{padding:18px;font-size:20px;margin-top:12px}
  button.in{background:#2e9e5b} button.out{background:#c94b53}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
  button.alt{background:#2b3b4c}
  .warn h1{color:#f0b429}
  .reasons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .reasons button{margin:0;padding:14px 8px;background:#2b3b4c;font-size:17px}
  .reasons button.on{background:#5288c1}
  textarea{width:100%;margin-top:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
           background:#17212b;color:var(--ink);font:inherit;font-size:15px;line-height:1.5;resize:none}
  .err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spin"></div>
  <h1 id="title">確認你的網路…</h1>
  <p class="sub" id="sub">請稍等</p>
  <div id="extra"></div>
</div>

<script src="config.js"></script>
<script>
const TG   = window.Telegram && window.Telegram.WebApp;
// 網址帶 ?type=in / ?type=out 就直接打;沒帶(左下角「打卡」選單按鈕)先讓人選
const PARAM = new URLSearchParams(location.search).get('type');
let TYPE = PARAM === 'out' ? 'out' : PARAM === 'in' ? 'in' : '';
const GAS  = (window.PUNCH_CONFIG || {}).GAS_URL || '';
const $ = id => document.getElementById(id);

if (TG) { TG.ready(); TG.expand(); }

function show(state, icon, title, sub, time, judge, net) {
  $('card').className = 'card ' + (state || '');
  $('card').innerHTML =
    (icon ? `<div class="icon">${icon}</div>` : '') +
    `<h1 id="title">${title}</h1>` +
    (time  ? `<div class="time">${time}</div>` : '') +
    (judge ? `<div class="judge">${judge}</div>` : '') +
    (sub   ? `<p class="sub">${sub}</p>` : '') +
    (net   ? `<div class="net">${net}</div>` : '') +
    `<button onclick="close_()">關閉</button>`;
}
function close_(){ if (TG) TG.close(); else history.back(); }

// ── 對外 IP:問三個來源,任何一個對得上就算數 ──
const timeout = (p, ms) =>
  Promise.race([p, new Promise((_, rj) => setTimeout(() => rj(new Error('timeout')), ms))]);

async function grab(url, parse) {
  const r = await timeout(fetch(url, { cache: 'no-store' }), 5000);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return parse(await r.text());
}
async function myIps() {
  const rs = await Promise.allSettled([
    grab('https://api4.ipify.org?format=json', t => JSON.parse(t).ip),
    grab('https://api64.ipify.org?format=json', t => JSON.parse(t).ip),
    grab('https://www.cloudflare.com/cdn-cgi/trace', t => (t.match(/^ip=(.+)$/m) || [])[1]),
  ]);
  const s = new Set();
  rs.forEach(r => { if (r.status === 'fulfilled' && r.value) s.add(String(r.value).trim()); });
  return [...s];
}

function choose() {
  $('card').className = 'card';
  $('card').innerHTML =
    `<h1>現在要打哪一種？</h1>` +
    `<button class="big in"  onclick="pick('in')">🟢　上班</button>` +
    `<button class="big out" onclick="pick('out')">🔴　下班</button>` +
    `<p class="sub" style="margin-top:14px">要先連上店裡的 Wi-Fi</p>`;
}
function pick(t) {
  TYPE = t;
  $('card').innerHTML = `<div class="spin"></div><h1>確認你的網路…</h1><p class="sub">請稍等</p>`;
  run();
}

async function run() {
  if (!TYPE) { choose(); return; }
  if (!GAS) {
    show('bad', '⚙️', '還沒設定', 'config.js 裡的 GAS_URL 是空的。');
    return;
  }
  if (!TG || !TG.initData) {
    show('bad', '📱', '請從 Telegram 開啟',
         '這一頁要從 bot 的「上班 / 下班」按鈕點進來，\n直接開網址沒辦法確認你的身分。');
    return;
  }

  try { IPS = await myIps(); } catch (e) { /* 交給後端判斷 */ }
  send({});
}

let IPS = [];
let OPT = {};   // confirm / reason,重送時累加
const LABEL = { in: '上班', out: '下班' };

function busy() {
  $('card').className = 'card';
  $('card').innerHTML = `<div class="spin"></div><h1>打卡中…</h1><p class="sub">請稍等</p>`;
}

async function send(extra) {
  OPT = Object.assign({}, OPT, extra);
  busy();
  let r;
  try {
    const res = await fetch(GAS, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // 避開 CORS preflight
      body: JSON.stringify(Object.assign({ action: 'punch', type: TYPE, ips: IPS, initData: TG.initData }, OPT)),
      redirect: 'follow',
    });
    r = await res.json();
  } catch (e) {
    show('bad', '📡', '連不上伺服器', '請確認網路，然後再試一次。');
    return;
  }

  const net = IPS.length ? '目前 IP　' + IPS.join('　') : '抓不到對外 IP';
  if (r.confirm) { askConfirm(r); return; }
  if (r.needReason) { askReason(r); return; }
  if (r.ok) {
    if (TG.HapticFeedback) TG.HapticFeedback.notificationOccurred('success');
    show('ok', TYPE === 'in' ? '🟢' : '🔴', r.title, '按錯的話，bot 訊息下面可以撤回（5 分鐘內）', r.message, r.detail || '', net);
  } else {
    if (TG.HapticFeedback) TG.HapticFeedback.notificationOccurred('error');
    show('bad', '🚫', r.title || '打卡失敗', (r.message || '').replace(/\n/g, '<br>'), '', '', net);
  }
}

// 看起來按錯:讓員工選「改打另一種 / 確定 / 取消」
function askConfirm(r) {
  if (TG.HapticFeedback) TG.HapticFeedback.notificationOccurred('warning');
  const sug = r.suggest && r.suggest !== TYPE ? r.suggest : '';
  $('card').className = 'card warn';
  $('card').innerHTML =
    `<div class="icon">🤔</div><h1>${r.title}</h1>` +
    `<p class="sub">${(r.message || '').replace(/\n/g, '<br>')}</p>` +
    (sug ? `<button class="big ${sug}" onclick="switchTo('${sug}')">改打${LABEL[sug]}卡</button>` : '') +
    `<button class="${sug ? 'alt' : 'big ' + TYPE}" onclick="send({confirm:true})">確定要打${LABEL[TYPE]}卡</button>` +
    `<button class="ghost" onclick="close_()">取消，不打卡</button>`;
}
function switchTo(t) { TYPE = t; send({ confirm: true }); }

// 提早下班:選原因
let PICK = '';
function askReason(r) {
  PICK = '';
  $('card').className = 'card warn';
  $('card').innerHTML =
    `<div class="icon">🏃</div><h1>${r.title}</h1>` +
    `<p class="sub">${(r.message || '').replace(/\n/g, '<br>')}</p>` +
    `<div class="reasons">` +
      ['事假', '病假', '公出', '其他'].map(k => `<button onclick="pickReason(this,'${k}')">${k}</button>`).join('') +
    `</div>` +
    `<textarea id="note" rows="2" maxlength="60" placeholder="補充說明（選「其他」要寫）"></textarea>` +
    `<div class="err" id="err"></div>` +
    `<button class="big out" onclick="sendReason()">送出，打下班卡</button>` +
    `<button class="ghost" onclick="close_()">取消，不打卡</button>`;
}
function pickReason(el, k) {
  PICK = k;
  document.querySelectorAll('.reasons button').forEach(b => b.classList.toggle('on', b === el));
  $('err').textContent = '';
}
function sendReason() {
  const note = $('note').value.trim();
  if (!PICK) { $('err').textContent = '請先選一個原因'; return; }
  if (PICK === '其他' && !note) { $('err').textContent = '選「其他」要寫一下原因'; return; }
  send({ confirm: true, reason: { kind: PICK, note: note } });
}
run();
</script>
</body>
</html>
