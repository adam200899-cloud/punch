<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打卡系統管理後台</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --ink:#1b2436; --muted:#7b869c; --line:#e3e8f0;
    --brand:#1f3864; --brand-ink:#fff; --ok:#1DB446; --warn:#E8A33D; --bad:#D64545;
    --soft:rgba(127,140,170,.08);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#101318; --card:#191d26; --ink:#eef1f6; --muted:#98a2b6; --line:#2a303c;
           --brand:#4a7bc4; --soft:rgba(127,140,170,.12); }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
       font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--brand)}
  h2{font-size:19px;margin:0 0 4px} h3{font-size:15px;margin:0 0 10px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px}

  /* ── 登入 ── */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login .card{width:100%;max-width:400px;text-align:center;padding:36px 28px}
  .login .logo{width:52px;height:52px;border-radius:14px;background:var(--brand);color:#fff;
               display:grid;place-items:center;font-size:24px;margin:0 auto 16px}
  .toggle{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:8px;text-decoration:underline}

  /* ── 版面 ── */
  .top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
       display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
  .top .brand{font-weight:700;color:var(--brand);white-space:nowrap}
  .top .spacer{flex:1}
  .top .me{font-size:13px;color:var(--muted);white-space:nowrap}
  .nav{display:flex;gap:4px;overflow-x:auto;padding:8px 18px 0;background:var(--card);
       border-bottom:1px solid var(--line);position:sticky;top:53px;z-index:19}
  .nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
              padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;border-radius:0}
  .nav button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
  main{max-width:1100px;margin:0 auto;padding:22px 18px 60px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .g4{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
  .stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  .stat{background:var(--soft);border-radius:12px;padding:14px}
  .stat .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat .l{font-size:12px;color:var(--muted)}

  label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  input,select,textarea{width:100%;font:inherit;font-size:14px;padding:9px 11px;border-radius:9px;
        border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
  textarea{min-height:110px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  .field{margin-bottom:14px}

  button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);
         padding:9px 15px;border-radius:9px;cursor:pointer;transition:opacity .12s}
  button:hover{opacity:.85} button:disabled{opacity:.45;cursor:not-allowed}
  button.pri{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
  button.danger{color:var(--bad);border-color:rgba(214,69,69,.35)}
  button.sm{padding:5px 10px;font-size:13px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -20px;padding:0 20px}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:12px;color:var(--muted);font-weight:600}
  tbody tr:hover{background:var(--soft)}
  td.wrap{white-space:normal}

  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--muted)}
  .tag.ok{background:rgba(29,180,70,.14);color:var(--ok)}
  .tag.bad{background:rgba(214,69,69,.14);color:var(--bad)}
  .tag.warn{background:rgba(232,163,61,.16);color:var(--warn)}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
         background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:10px;font-size:14px;
         transition:.22s;pointer-events:none;z-index:100;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.bad{background:var(--bad);color:#fff}

  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;word-break:break-all}
  .urlbox{background:var(--soft);border-radius:9px;padding:10px 12px;margin-bottom:10px}
  .urlbox .lb{font-size:12px;color:var(--muted);margin-bottom:3px}
  .note{font-size:13px;color:var(--muted);line-height:1.7}
  .empty{text-align:center;color:var(--muted);padding:30px;font-size:14px}
  .hide{display:none !important}
</style>
</head>
<body>

<!-- ────────── 登入 ────────── -->
<div class="login" id="loginView">
  <div class="card">
    <div class="logo">⏱</div>
    <h2>打卡系統管理後台</h2>
    <p class="sub" id="loginHint">請登入</p>

    <button class="pri" id="btnLogin" style="width:100%;padding:12px">登入</button>

    <div id="extraFields" class="hide" style="margin-top:18px;text-align:left">
      <div class="field">
        <label>邀請碼(第一次加入請填)</label>
        <input id="inviteCode" placeholder="例如 K7MQZP2X" autocapitalize="characters">
      </div>
      <div class="field">
        <label>首次啟用碼(只有建立平台時用一次)</label>
        <input id="setupCode" placeholder="執行 setupPlatform() 後取得" autocapitalize="characters">
      </div>
      <button class="pri" id="btnJoin" style="width:100%">送出並登入</button>
    </div>
    <button class="toggle" id="btnExtra">我有邀請碼 / 首次啟用</button>
  </div>
</div>

<!-- ────────── 主畫面 ────────── -->
<div id="appView" class="hide">
  <div class="top">
    <span class="brand">⏱ 打卡後台</span>
    <select id="coSelect" style="width:auto;min-width:170px"></select>
    <span class="spacer"></span>
    <span class="me" id="meLabel"></span>
    <button class="sm" id="btnLogout">登出</button>
  </div>

  <div class="nav" id="nav"></div>
  <main id="view"></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ─────────────────────────────────────────────
   設定集中在 config.js,這裡不用改
   ───────────────────────────────────────────── */
const CFG = window.PUNCH_CONFIG || {};
const ADMIN_URL = (CFG.GAS_URL || '') + '?p=admin';   // 後台一律直連,不走 Worker
const ADMIN_PLATFORM = CFG.ADMIN_PLATFORM || 'telegram';
const ADMIN_LIFF_ID = CFG.ADMIN_LIFF_ID || '';
const CONFIG_OK = (CFG.GAS_URL || '').indexOf('script.google.com') > 0
                  && (CFG.GAS_URL || '').indexOf('請貼上') < 0;

let TOKEN = localStorage.getItem('punch_admin_token') || '';
let ME = null, COMPANIES = [], CO = null, TAB = 'overview';
let AUTH = null;                                    // {idToken} 或 {initData}
const tg = window.Telegram && window.Telegram.WebApp;

// ── 提示 ──
let toastTimer;
function toast(msg, bad){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.className='toast'; }, bad ? 4200 : 2200);
}

// ── API ──
async function api(action, params){
  const res = await fetch(ADMIN_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action, token: TOKEN, company: CO}, params||{})),
    redirect:'follow',
  });
  const r = await res.json();
  if(!r.ok){
    if(r.code === 'UNAUTHORIZED'){ logout(true); throw new Error(r.message || '請重新登入'); }
    throw new Error(r.message || '操作失敗');
  }
  return r;
}

// ── 登入流程 ──

/** 取得身分憑證。Telegram 從 WebApp 拿,LINE 走 LIFF。 */
async function ensureAuth(interactive){
  if(AUTH) return AUTH;

  if(ADMIN_PLATFORM === 'telegram'){
    if(!tg || !tg.initData){
      $('loginHint').textContent = '請從你的 Telegram 管理 bot 開啟後台(輸入框旁的選單按鈕),才能辨識身分。';
      return null;
    }
    tg.ready(); tg.expand();
    AUTH = { initData: tg.initData };
    return AUTH;
  }

  if(!liff.isLoggedIn()){
    if(interactive) liff.login({ redirectUri: location.href });
    return null;
  }
  const idToken = liff.getIDToken();
  if(!idToken){
    $('loginHint').textContent = '取不到 ID Token,請確認 LIFF 已開啟 openid 權限';
    return null;
  }
  AUTH = { idToken: idToken };
  return AUTH;
}

async function boot(){
  if(!CONFIG_OK){
    $('loginHint').textContent = 'config.js 裡的 GAS_URL 還沒填,請先貼上 Apps Script 的 /exec 網址。';
    $('btnLogin').disabled = true;
    return;
  }
  $('btnLogin').textContent = ADMIN_PLATFORM === 'telegram' ? '登入' : '使用 LINE 登入';

  if(ADMIN_PLATFORM === 'line'){
    try{
      await liff.init({ liffId: ADMIN_LIFF_ID });
    }catch(e){
      $('loginHint').textContent = 'LIFF 初始化失敗:' + (e.message || e);
      $('btnLogin').disabled = true;
      return;
    }
  }

  if(TOKEN){
    try{
      ME = (await api('admin.me')).me;
      return openApp();
    }catch(e){ TOKEN=''; localStorage.removeItem('punch_admin_token'); }
  }

  if(await ensureAuth(false)) await tryLogin();
}

async function tryLogin(extra){
  try{
    const r = await api('admin.login', Object.assign({}, AUTH, extra||{}));
    TOKEN = r.token; ME = r.me;
    localStorage.setItem('punch_admin_token', TOKEN);
    openApp();
  }catch(e){
    $('loginHint').textContent = e.message;
    $('extraFields').classList.remove('hide');
  }
}

$('btnLogin').addEventListener('click', async ()=>{
  if(!await ensureAuth(true)) return;
  await tryLogin();
});

$('btnExtra').addEventListener('click', ()=> $('extraFields').classList.toggle('hide'));

$('btnJoin').addEventListener('click', async ()=>{
  if(!await ensureAuth(true)) return;
  const setup = $('setupCode').value.trim();
  const invite = $('inviteCode').value.trim();
  try{
    if(setup){
      const r = await api('admin.bootstrap', Object.assign({setupCode: setup}, AUTH));
      TOKEN = r.token; ME = r.me;
      localStorage.setItem('punch_admin_token', TOKEN);
      return openApp();
    }
    await tryLogin({inviteCode: invite});
  }catch(e){ toast(e.message, true); }
});

function logout(silent){
  TOKEN=''; ME=null; localStorage.removeItem('punch_admin_token');
  $('appView').classList.add('hide');
  $('loginView').classList.remove('hide');
  if(!silent) toast('已登出');
}
$('btnLogout').addEventListener('click', ()=>logout());

// ── 進入後台 ──
async function openApp(){
  $('loginView').classList.add('hide');
  $('appView').classList.remove('hide');
  $('meLabel').textContent = ME.name + '(' + ME.role + '管理員)';

  const r = await api('company.list');
  COMPANIES = r.companies;

  const sel = $('coSelect');
  sel.innerHTML = COMPANIES.map(c=>`<option value="${esc(c.code)}">${esc(c.name)}</option>`).join('');
  if(COMPANIES.length === 0){
    sel.innerHTML = '<option value="">(尚未建立公司)</option>';
    CO = null;
  }else{
    CO = COMPANIES[0].code;
    sel.value = CO;
  }
  sel.onchange = ()=>{ CO = sel.value; render(); };

  buildNav();
  render();
}

const TABS = [
  {id:'overview', label:'總覽'},
  {id:'employees',label:'員工'},
  {id:'ip',       label:'允許網段'},
  {id:'settings', label:'出勤設定'},
  {id:'leaves',   label:'請假審核'},
  {id:'rules',    label:'守則與假別'},
  {id:'records',  label:'紀錄與報表'},
  {id:'bot',      label:'通訊平台'},
  {id:'members',  label:'管理員'},
  {id:'platform', label:'平台管理', platformOnly:true},
];

function buildNav(){
  const tabs = TABS.filter(t => !t.platformOnly || ME.role === '平台');
  $('nav').innerHTML = tabs.map(t=>`<button data-tab="${t.id}">${t.label}</button>`).join('');
  $('nav').querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ TAB = b.dataset.tab; render(); };
  });
}

function render(){
  $('nav').querySelectorAll('button').forEach(b=> b.classList.toggle('on', b.dataset.tab===TAB));
  const v = $('view');
  v.innerHTML = '<div class="empty">載入中…</div>';

  if(!CO && TAB !== 'platform'){
    v.innerHTML = '<div class="card"><div class="empty">還沒有任何公司。' +
      (ME.role==='平台' ? '請到「平台管理」新增第一家公司。' : '請聯絡平台管理員。') + '</div></div>';
    return;
  }

  const fn = ({
    overview: viewOverview, employees: viewEmployees, ip: viewIp, settings: viewSettings,
    records: viewRecords, bot: viewBot, members: viewMembers, platform: viewPlatform,
    leaves: viewLeaves, rules: viewRules,
  })[TAB];
  fn(v).catch(e => { v.innerHTML = `<div class="card"><div class="empty">${esc(e.message)}</div></div>`; });
}

// ══════════════════════ 總覽 ══════════════════════
async function viewOverview(v){
  const d = await api('company.overview');
  v.innerHTML = `
    <h2>${esc(d.name)}</h2>
    <p class="sub">公司代碼 ${esc(CO)} · 使用 ${esc(d.platformLabel)}</p>
    <div class="card">
      <div class="stats">
        <div class="stat"><div class="n">${d.active}</div><div class="l">在職員工</div></div>
        <div class="stat"><div class="n">${d.bound}</div><div class="l">已綁定 LINE</div></div>
        <div class="stat"><div class="n">${d.todayIn}</div><div class="l">今日上班打卡</div></div>
        <div class="stat"><div class="n">${d.todayOut}</div><div class="l">今日下班打卡</div></div>
        <div class="stat"><div class="n">${d.ipRules}</div><div class="l">啟用中網段</div></div>
      </div>
    </div>
    <div class="card">
      <h3>設定檢查</h3>
      <table><tbody>
        <tr><td>${esc(d.platformLabel)} 設定</td><td>${d.botReady?'<span class="tag ok">已完成</span>':'<span class="tag bad">未完成</span>'}</td></tr>
        <tr><td>打卡頁連結</td><td>${d.punchUrl?`<span class="mono">${esc(d.punchUrl)}</span>`:'<span class="tag bad">尚未產生</span>'}</td></tr>
        <tr><td>待設定員工</td><td>${d.pendingEmployees?`<span class="tag warn">${d.pendingEmployees} 人等你設定</span>`:'<span class="tag ok">無</span>'}</td></tr>
        <tr><td>待審核請假</td><td>${d.pendingLeaves?`<span class="tag warn">${d.pendingLeaves} 筆待處理</span>`:'<span class="tag ok">無</span>'}</td></tr>
        <tr><td>地點(IP)驗證</td><td>${d.ipEnforced?'<span class="tag ok">啟用中</span>':'<span class="tag warn">已關閉</span>'}</td></tr>
        <tr><td>允許網段</td><td>${d.ipRules>0?`<span class="tag ok">${d.ipRules} 條</span>`:'<span class="tag bad">尚未設定,所有人都打不了卡</span>'}</td></tr>
        <tr><td>未綁定 LINE 的員工</td><td>${d.active-d.bound>0?`<span class="tag warn">${d.active-d.bound} 人</span>`:'<span class="tag ok">全部完成</span>'}</td></tr>
      </tbody></table>
      <div class="row" style="margin-top:14px">
        <a href="${esc(d.sheetUrl)}" target="_blank" rel="noopener"><button>開啟這家公司的試算表 ↗</button></a>
      </div>
    </div>`;
}

// ══════════════════════ 員工 ══════════════════════
async function viewEmployees(v){
  const d = await api('emp.list');
  const pending = d.employees.filter(e=>e.pending);
  const active  = d.employees.filter(e=>!e.pending);

  v.innerHTML = `
    <h2>員工</h2>
    <p class="sub">員工在聊天室輸入「綁定」兩個字之後會出現在這裡,由你填上他是誰。</p>

    ${pending.length ? `
    <div class="card" style="border:1px solid var(--warn)">
      <h3>⏳ 待設定(${pending.length})</h3>
      <p class="note" style="margin-bottom:14px">
        這些人已經綁定 Telegram,但還沒有身分資料,<b>還不能打卡</b>。
        對照「Telegram 暱稱」確認是誰,填上編號與姓名後按「設定」。
      </p>
      <div class="tw"><table>
        <thead><tr><th>Telegram 暱稱</th><th>綁定時間</th><th>員工編號 *</th><th>姓名 *</th><th>部門</th><th></th></tr></thead>
        <tbody>${pending.map(e=>`<tr data-uid="${esc(e.userId)}">
          <td><b>${esc(e.lineName || '(沒有設定名稱)')}</b></td>
          <td class="note">${esc(e.boundAt)}</td>
          <td><input class="a-code" placeholder="A001" style="width:96px"></td>
          <td><input class="a-name" placeholder="姓名" style="width:110px"></td>
          <td><input class="a-dept" placeholder="部門" style="width:110px"></td>
          <td class="row">
            <button class="sm pri a-go">設定</button>
            <button class="sm a-del">刪除</button>
          </td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>` : ''}

    <div class="card">
      <h3>新增 / 修改</h3>
      <p class="note" style="margin-bottom:12px">先建好資料也可以 —— 員工改用「綁定 員工編號」就能自己對上。</p>
      <div class="grid g2">
        <div class="field"><label>員工編號 *</label><input id="eCode" placeholder="A001"></div>
        <div class="field"><label>姓名 *</label><input id="eName"></div>
        <div class="field"><label>部門</label><input id="eDept"></div>
        <div class="field"><label>狀態</label>
          <select id="eStatus"><option>在職</option><option>離職</option></select></div>
      </div>
      <button class="pri" id="eSave">儲存</button>
    </div>

    <div class="card">
      <h3>名冊(${active.length})</h3>
      <div class="row" style="margin-bottom:12px">
        <button class="sm" id="eImport">批次匯入</button>
        <button class="sm" id="eExport">匯出 CSV</button>
      </div>
      <div class="tw"><table>
        <thead><tr><th>編號</th><th>姓名</th><th>部門</th><th>狀態</th><th>綁定</th><th>Telegram 暱稱</th><th></th></tr></thead>
        <tbody>${active.length?active.map(e=>`<tr>
          <td class="mono">${esc(e.code)}</td><td>${esc(e.name)}</td><td>${esc(e.dept)}</td>
          <td>${e.status==='在職'?'<span class="tag ok">在職</span>':`<span class="tag bad">${esc(e.status)}</span>`}</td>
          <td>${e.bound?`<span class="tag ok">已綁定</span><div class="note">${esc(e.boundAt)}</div>`:'<span class="tag warn">未綁定</span>'}</td>
          <td>${esc(e.lineName||'—')}</td>
          <td class="row">
            <button class="sm" data-edit="${esc(e.code)}">編輯</button>
            ${e.bound?`<button class="sm" data-unbind="${esc(e.code)}">解除綁定</button>`:''}
            <button class="sm" data-del="${esc(e.code)}">刪除</button>
          </td>
        </tr>`).join(''):'<tr><td colspan="7" class="empty">還沒有員工</td></tr>'}</tbody>
      </table></div>
    </div>`;

  // ── 待設定:填完按「設定」 ──
  v.querySelectorAll('tr[data-uid]').forEach(tr=>{
    const uid = tr.dataset.uid;
    tr.querySelector('.a-go').onclick = async ()=>{
      const employee = {
        code: tr.querySelector('.a-code').value.trim(),
        name: tr.querySelector('.a-name').value.trim(),
        dept: tr.querySelector('.a-dept').value.trim(),
        status: '在職',
      };
      if(!employee.code || !employee.name) return toast('員工編號與姓名都要填', true);
      try{
        const r = await api('emp.assign', {userId: uid, employee});

/** 試算表把 09:00 存成 Date 時,序列化回來會是 ISO 字串 */
function fmtVal(v){
  if(typeof v === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(v)){
    const d = new Date(v);
    return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }
  return v;
}

      const r = await api('record.query', {from:$('qFrom').value, to:$('qTo').value, employeeCode:$('qEmp').value.trim()});
      LAST = r.records;
      $('qBox').innerHTML = `
        <p class="note" style="margin-bottom:10px">共 ${r.records.length} 筆${r.records.length>=1000?'(僅顯示最新 1000 筆)':''}</p>
        <div class="tw"><table>
          <thead><tr><th>時間</th><th>員工</th><th>類型</th><th>判定</th><th>地點</th><th>來源IP</th><th>驗證方式</th></tr></thead>
          <tbody>${r.records.length?r.records.map(x=>`<tr>
            <td class="mono">${esc(x.datetime)}</td>
            <td>${esc(x.name)}<div class="note">${esc(x.code)}</div></td>
            <td>${esc(x.type)}</td>
            <td>${x.judgement==='正常'?'<span class="tag ok">正常</span>':`<span class="tag warn">${esc(x.judgement)}</span>`}</td>
            <td>${esc(x.location)}</td>
            <td class="mono">${esc(x.ip)}</td>
            <td>${esc(x.device)}</td>
          </tr>`).join(''):'<tr><td colspan="7" class="empty">查無資料</td></tr>'}</tbody>
        </table></div>`;
    }catch(e){ $('qBox').innerHTML = `<span class="note" style="color:var(--bad)">${esc(e.message)}</span>`; }
  };
  $('qGo').onclick = run;
  $('qCsv').onclick = ()=>{
    if(!LAST.length) return toast('沒有資料可匯出', true);
    const head = ['時間','員工編號','姓名','部門','類型','判定','地點','來源IP','裝置'];
    const rows = LAST.map(x=>[x.datetime,x.code,x.name,x.dept,x.type,x.judgement,x.location,x.ip,x.device]);
    const csv = '\ufeff' + [head].concat(rows).map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download = `打卡紀錄_${CO}_${$('qFrom').value}_${$('qTo').value}.csv`;
    a.click();
  };
  run();
}

/** 自動設定的結果:做完了什麼、還剩什麼要手動 */
function renderSetupResult(r){
  const done = (r.done||[]).map(x=>`<div>✅ ${esc(x)}</div>`).join('');
  const manual = (r.manual||[]).map(x=>`<div>⚠️ ${esc(x)}</div>`).join('');
  if(!done && !manual) return '<span class="note">沒有需要處理的項目</span>';
  return `<div class="urlbox" style="line-height:1.9">${done}${manual}</div>`;
}

}

// ══════════════════════ 工具 ══════════════════════
function downloadCsv(filename, rows){
  const csv = rows.map(r => r.map(c => {
    const s = String(c==null?'':c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\r\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});   // BOM 讓 Excel 正確辨識中文
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

boot();
</script>
