<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>查詢對外 IP</title>
<style>
  :root{ --bg:#f4f6fb; --card:#fff; --ink:#1b2436; --muted:#7b869c;
         --brand:#1f3864; --good:#0ca30c; --crit:#d03b3b; --line:#e6eaf2; }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#12151c; --card:#1b1f2a; --ink:#eef1f6; --muted:#98a2b6; --line:#2b3140; --brand:#3f6bb0; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--ink);padding:24px;
       font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}
  .card{background:var(--card);border-radius:18px;padding:32px 28px;max-width:440px;width:100%;
        text-align:center;box-shadow:0 1px 3px rgba(16,24,40,.06),0 10px 30px rgba(16,24,40,.06)}
  h1{font-size:19px;margin:0 0 6px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 26px;line-height:1.7}
  .ip{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;
      word-break:break-all;line-height:1.3;margin:8px 0}
  .ip.wait{font-size:17px;font-weight:500;color:var(--muted)}
  .lb{font-size:12px;color:var(--muted);letter-spacing:.06em}
  .v6{font-size:14px;color:var(--muted);margin-top:14px;word-break:break-all}
  button{font:inherit;border:0;border-radius:12px;padding:13px 20px;font-size:15px;font-weight:600;
         color:#fff;background:var(--brand);cursor:pointer;margin-top:22px;width:100%}
  .note{font-size:12px;color:var(--muted);line-height:1.8;margin-top:22px;
        padding-top:18px;border-top:1px solid var(--line);text-align:left}
</style>
</head>
<body>
<div class="card">
  <h1>你目前的對外 IP</h1>
  <p class="sub">請確認這台裝置正連著<b>公司的 Wi-Fi</b>,<br>並且關閉行動網路、VPN 與 Proxy。</p>

  <div class="lb">IPv4</div>
  <div class="ip wait" id="v4">偵測中…</div>
  <div class="v6" id="v6"></div>

  <button id="copy">複製</button>

  <div class="note">
    把上面這組數字回報給管理員,填進打卡系統的「允許網段」之後,
    這個網路環境底下的同仁才打得了卡。<br><br>
    如果數字每天都不一樣,代表這條網路是浮動 IP,要跟 ISP 申請固定 IP。
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const T = (p, ms) => Promise.race([p, new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')), ms))]);
const get = (url, parse) => T(fetch(url,{cache:'no-store'}), 6000)
  .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); }).then(parse);

(async () => {
  const [v4, v6] = await Promise.allSettled([
    get('https://api4.ipify.org?format=json', t => JSON.parse(t).ip)
      .catch(() => get('https://www.cloudflare.com/cdn-cgi/trace', t => (t.match(/^ip=(.+)$/m)||[])[1])),
    get('https://api64.ipify.org?format=json', t => JSON.parse(t).ip),
  ]);

  const a = v4.status === 'fulfilled' ? v4.value : null;
  const b = v6.status === 'fulfilled' ? v6.value : null;

  if(a){ $('v4').textContent = a; $('v4').classList.remove('wait'); }
  else { $('v4').textContent = '偵測失敗,請檢查網路'; }

  if(b && b !== a) $('v6').textContent = 'IPv6:' + b;

  $('copy').onclick = () => {
    const txt = [a, (b && b !== a) ? b : null].filter(Boolean).join('\n');
    if(!txt) return;
    navigator.clipboard.writeText(txt)
      .then(()=>{ $('copy').textContent = '已複製 ✓'; setTimeout(()=>$('copy').textContent='複製', 1600); })
      .catch(()=>{ $('copy').textContent = '請手動選取複製'; });
  };
})();
</script>
</body>
</html>
